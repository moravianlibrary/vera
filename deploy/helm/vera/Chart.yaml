apiVersion: v2
name: vera
description: VERA, the Moravian Library's digitization planner, with its database and optional observability stack.
type: application
version: 0.1.0
appVersion: "0.1.0"
dependencies:
  # HyperDX, ClickHouse and the OpenTelemetry collector (OBS-pipeline).
  - name: clickstack
    version: 1.1.1
    repository: https://hyperdxio.github.io/helm-charts
    condition: observability.enabled
