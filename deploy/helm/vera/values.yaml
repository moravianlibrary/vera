# VERA's chart installs the application and optional observability stack.
observability:
  enabled: true

# Values for the ClickStack chart (hyperdxio/helm-charts, clickstack).
clickstack:
  hyperdx:
    # HyperDX does not report its own usage to its makers.
    usageStatsEnabled: false

localAccess:
  enabled: false
  port: 8400
  hyperdxPort: 8300
  otlpGrpcPort: 4317
  otlpHttpPort: 4318

vera:
  enabled: true
  publicUrl: ""
  replicas:
    api: 1
    worker: 1
  image:
    backend:
      repository: vera-backend
      tag: ""
      pullPolicy: IfNotPresent
    frontend:
      repository: vera-frontend
      tag: ""
      pullPolicy: IfNotPresent
  resources:
    api: {}
    worker: {}
    frontend: {}
  database:
    instances: 3
    storage:
      size: 10Gi
      class: ""
  ingress:
    enabled: false
    className: ""
    host: ""
    tlsSecret: ""
  localAccess:
    port: 8400
  localServices:
    enabled: false
  secret:
    # Supply these through a private values file, or use vera.existingSecret.
    firstAdminEmail: ""
    firstAdminPassword: ""
    watchlistLinkKey: ""
    pushVapidPublicKey: ""
    pushVapidPrivateKey: ""
    pushSubject: ""
  existingSecret: ""
  trustedCertificates: ""
