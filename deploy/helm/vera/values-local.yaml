# A local k3d cluster (make obs-up): HyperDX on http://localhost:8300, OTLP on localhost:4317
# (gRPC) and localhost:4318 (HTTP). Small volumes; k3d's local-path storage.

clickstack:
  global:
    storageClassName: local-path
  hyperdx:
    frontendUrl: "http://localhost:8300"
  clickhouse:
    persistence:
      dataSize: 5Gi
      logSize: 1Gi
  mongodb:
    persistence:
      dataSize: 1Gi

localAccess:
  enabled: true

vera:
  publicUrl: http://localhost:8400
  installationSeed: /app/installation-mzk.json
  replicas:
    api: 1
    worker: 1
  database:
    instances: 1
    storage:
      size: 2Gi
      class: local-path
  localServices:
    enabled: true
    instances: true
    keycloak:
      staffPassword: staff-password
      curatorPassword: curator-password
      digitizationPassword: digitization-password
      clientSecret: vera-test-secret
