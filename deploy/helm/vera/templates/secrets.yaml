{{- if and .Values.vera.enabled (not .Values.vera.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vera.secretName" . }}
  labels:
    {{- include "vera.labels" . | nindent 4 }}
type: Opaque
stringData:
  VERA_FIRST_ADMIN_EMAIL: {{ .Values.vera.secret.firstAdminEmail | quote }}
  VERA_FIRST_ADMIN_PASSWORD: {{ .Values.vera.secret.firstAdminPassword | quote }}
  VERA_WATCHLIST_LINK_KEY: {{ .Values.vera.secret.watchlistLinkKey | quote }}
  VERA_PUSH_VAPID_PUBLIC_KEY: {{ .Values.vera.secret.pushVapidPublicKey | quote }}
  VERA_PUSH_VAPID_PRIVATE_KEY: {{ .Values.vera.secret.pushVapidPrivateKey | quote }}
  VERA_PUSH_SUBJECT: {{ .Values.vera.secret.pushSubject | quote }}
{{- end }}
{{- if and .Values.vera.enabled .Values.vera.trustedCertificates }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-trusted-certificates
  labels:
    {{- include "vera.labels" . | nindent 4 }}
type: Opaque
stringData:
  certificates.pem: {{ .Values.vera.trustedCertificates | quote }}
{{- end }}
