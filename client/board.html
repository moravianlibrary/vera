<!DOCTYPE html>

<div class="board">

    <ul class="funcbar">
        <li><button id="insertDocButton">Insert</button></li>
    </ul>

    <div class="table-container">
        <table id="boardTable">
            <thead>
                <tr>
                    <th>Sysno</th>
                    <th>Volume Number</th>
                    <th>Item Number</th>
                    <th>Category</th>
                    <th>Title</th>
                    <th>Pages Count</th>
                    <th>Signature</th>
                    <th>ISSN</th>
                    <th>ISBN</th>
                    <th>Barcode</th>
                    <th>Creator</th>
                    <th>Created At</th>
                    <th>Extractor</th>
                    <th>Extracted At</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <dialog id="documentEntryDialog">
        <h2>Data Entry</h2>
        <form id="documentEntryForm">
            <!-- Information -->
            <label for="sysno">Sysno:</label>
            <input type="text" id="sysno" name="sysno" required>
            <br>

            <label for="volume_number">Volume Number:</label>
            <input type="text" id="volume_number" name="volume_number">
            <br>

            <label for="item_number">Item Number:</label>
            <input type="text" id="item_number" name="item_number">
            <br>

            <label for="category">Category:</label>
            <input type="text" id="category" name="category" required>
            <br>

            <label for="title">Title:</label>
            <input type="text" id="title" name="title" required>
            <br>

            <label for="pages_count">Pages Count:</label>
            <input type="number" id="pages_count" name="pages_count">
            <br>

            <!-- Additional Information -->
            <label for="signature">Signature:</label>
            <input type="text" id="signature" name="signature">
            <br>

            <label for="issn">ISSN:</label>
            <input type="text" id="issn" name="issn">
            <br>

            <label for="isbn">ISBN:</label>
            <input type="text" id="isbn" name="isbn">
            <br>

            <label for="barcode">Barcode:</label>
            <input type="text" id="barcode" name="barcode">
            <br>

            <!-- Buttons for confirmation and cancellation -->
            <button type="button" id="cancelButton">Cancel</button>
            <button type="submit" id="confirmButton">Confirm</button>
        </form>
    </dialog>
</div>
