catalogConfig:
  main:
    properties:
      cnb:
        source:
          - field: "015"
            subfield: "a"
            pattern: "^cnb(\\d{9})$"

      language:
        source:
          - field: "008"
            controlFieldPosition: [35, 37]

      isxn:
        source:
          - field: "020"
            subfield: "a"
          - field: "022"
            subfield: "a"
        takeFirst: true

      signature:
        source:
          - field: "910"
            subfield: "b"
          - field: "910"
            subfield: "c"
        takeFirst: true

      barcodes:
        source:
          - field: "020"
            subfield: "a"

      materialType:
        source:
          - field: "990"
            subfield: "a"

      author:
        source:
          - field: "100"
            subfield: "a"

      title:
        source:
          - field: "245"
            subfield: "a"

      subtitle:
        source:
          - field: "245"
            subfield: "b"

      extent:
        source:
          - field: "300"
            subfield: "a"

      size:
        source:
          - field: "300"
            subfield: "c"

      locationUri:
        source:
          - field: "856"
            ind1: "4"
            ind2: "1"
            subfield: "u"
      
      currentFrequency:
        source:
          - tuple:
            - field: "310"
              subfield: "a"
            - field: "310"
              subfield: "b"

      formerFrequency:
        source:
          - tuple:
            - field: "321"
              subfield: "a"
            - field: "321"
              subfield: "b"

