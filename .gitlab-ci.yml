
variables:
  CACHE_REGISTRY_URL: docker.app.knihovny.cz
  BASE_IMAGE_NAME: digiboard
  BUILD_IMAGE_TAG: branch-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
  BUILD_IMAGE_NAME: $CI_REGISTRY_IMAGE/$BASE_IMAGE_NAME:$BUILD_IMAGE_TAG
  CACHE_IMAGE_NAME: $CI_REGISTRY_IMAGE/$BASE_IMAGE_NAME:build
  DEPLOY_REPOSITORY: gitlab.mzk.cz:osdd/deploys/random
  DEPLOY_JOB_IMAGE: "docker.app.knihovny.cz/ci-builds/kustomize:latest"
  TARGET_IMAGE_TEMPLATE_NAME: mzk.cz/busybox
  CONTAINER_PUSH_EXTRA_FLAGS: "-q"

stages:
  - test
  - build
  - deploy

build and push image:
  stage: build
  image: ${CACHE_REGISTRY_URL}/mirrors/docker:20.10-git
  artifacts:
    paths:
      - artifacts/images/*.txt
    expire_in: 30 days
  rules:
      - if: # if branch main, run build on main
          ( $CI_PIPELINE_SOURCE == "push" )  && ( $CI_COMMIT_BRANCH == "main" )
      - if: # if branch test, run build on test
          ( $CI_PIPELINE_SOURCE == "push" )  && ( $CI_COMMIT_BRANCH == "test" )
      - if: # run build on manual
          ( $CI_PIPELINE_SOURCE == "web" )  && ( $CI_COMMIT_BRANCH == "main" )
      - if: # run build on manual
          ( $CI_PIPELINE_SOURCE == "web" )  && ( $CI_COMMIT_BRANCH == "test" )

  services:
    - ${CACHE_REGISTRY_URL}/mirrors/docker:20.10-dind

  before_script:
    - mkdir -p $HOME/.docker
    - id
    - apk add make
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - mkdir -p artifacts/images

  script:
    - cd ${CI_PROJECT_DIR}
    # get cached image
    - |
      if docker pull -q $CACHE_IMAGE_NAME; then
        echo "Cache image has been loaded"
      fi

    # build image
    - make image

    - make tag
  
    # upload image cache to repo
    - make push

    # save images under new name
    # - docker tag $CACHE_IMAGE_NAME $BUILD_IMAGE_NAME
    # - echo docker push -q $BUILD_IMAGE_NAME
    # - echo $BUILD_IMAGE_NAME > artifacts/images/name.txt
    # - docker push -q $BUILD_IMAGE_NAME 

deploy image:
  stage: deploy
  image: ${DEPLOY_JOB_IMAGE}
  retry:
    max: 1

  variables:
    GIT_STRATEGY: none # no need to clone
    SOURCE_BRANCH: $CI_DEFAULT_BRANCH
    DEPLOY_REPO_BRANCH: main # main, because deployment repository does not have any other branches
    DEPLOY_STRATEGY: manual # should be manual or always

  rules:
      - if: # deploy manual
          ( $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web" )  && 
          ( $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "test" ) && 
          ( $DEPLOY_STRATEGY == "manual" )
        when: manual
        allow_failure: true
      - if: # deploy auto
          ( $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web" )  && 
          ( $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "test" ) && 
          ( $DEPLOY_STRATEGY == "always" )
        when: always
        allow_failure: false

  script:
    - echo "Deploying ${BUILD_IMAGE_NAME}:${BUILD_IMAGE_TAG}"
    #- mkdir ${HOME}/.ssh; install -m 0600 ${K8S_DEPLOY_KEY} ${HOME}/.ssh/id_rsa
    #- ssh-keyscan gitlab.mzk.cz >> ${HOME}/.ssh/known_hosts
    - git clone https://${GITLAB_DEPLOY_TOKEN}:${GITLAB_DEPLOY_TOKEN_PASSWORD}@${DEPLOY_REPOSITORY}.git deployment
    - |
        if [ $CI_COMMIT_BRANCH == "main" ]; then
            DEPLOY_REPO_DIR="production"
        elif [ $CI_COMMIT_BRANCH == "test" ]; then
            DEPLOY_REPO_DIR="test"
        fi
    - cd deployment/${DEPLOY_REPO_DIR}
    - pwd
    - git checkout ${DEPLOY_REPO_BRANCH}
    - echo "Deploying ${BUILD_IMAGE_NAME}"
    - kustomize edit set image ${TARGET_IMAGE_TEMPLATE_NAME}=${BUILD_IMAGE_NAME}
    # provide commit-id
    - mkdir -p config
    - echo -n ${CI_COMMIT_SHORT_SHA} > config/commit-id.txt
    # overwrite annotation to force deploy
    - |
        if [ -f patch-version.yml ]; then
            envsubst < patch-version.yml.template > patch-version.yml
        fi
    # create git config
    - git config user.name "${GITLAB_USER_NAME} by Gitlab Robot"
    - git config user.email "${GITLAB_USER_EMAIL}"
    - |
        cat >> ${TMP_DIR}/commit-message <<EOF
        deploy(${CI_COMMIT_SHORT_SHA}): ${CI_COMMIT_TITLE}
        * ${CI_COMMIT_REF_NAME}
        * Upgrade image version to ${BUILD_IMAGE_NAME}
        * Upgrade image tag to ${BUILD_IMAGE_tag}
        * commit: ${CI_PROJECT_URL}/-/commit/${CI_COMMIT_SHORT_SHA}
        * CI job: ${CI_JOB_URL}
        EOF
    - git add .
    - |
        git commit --file ${TMP_DIR}/commit-message --allow-empty
    - git push
    - DEPLOY_COMMIT_ID=$(git rev-parse HEAD | cut -c1-12)
    - echo https://${DEPLOY_REPOSITORY}/-/commits/${DEPLOY_COMMIT_ID}


Debug variables:
  ## This job is used to explore CI/CD variables
  ##
  ## Go to: https://gitlab.mzk.cz/osdd/Holly/-/pipelines/new, click on the "Run pipeline" button and
  ## add the following variables:
  ## CI_DEBUG - set to true
  ##
  stage: test
  rules:
    - if: $CI_DEBUG
      when: manual
      allow_failure: true
  script:
    - export
