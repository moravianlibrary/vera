version: '3.1'

services:
  postgres:
    image: postgres:latest
    container_name: digiboard-postgres
    environment:
      POSTGRES_USER: digiboardAdmin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: digiboard
    ports:
      - "5432:5432"
    volumes:
      # - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      # - ./populate.sql:/docker-entrypoint-initdb.d/populate.sql
      - data:/var/lib/postgresql/data
    networks:
      - digiboard

  redis:
    container_name: digiboard-redis
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      - digiboard

  worker:
    container_name: digiboard-worker
    build:
      context: ./server
      dockerfile: Dockerfile_celery
    restart: unless-stopped
    environment:
      - BROKER_URL=redis://redis:6379/0
      - POSTGRES_HOST=postgres
    depends_on:
      - postgres
      - redis
    networks:
      - digiboard

  server:
    container_name: digiboard-server
    build:
      context: ./server
        #dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - BROKER_URL=redis://redis:6379/0
      - DEBUG=True
      - POSTGRES_HOST=postgres
      - ALLOW_ORIGINS=http://localhost:3000
      - TIMEZONE=Europe/Prague
      - KEYCLOAK_CLIENT_ID=vera-backend
      - KEYCLOAK_REALM=mzk
      - KEYCLOAK_SERVER_URL=https://keycloak.osdd.mzk.cz
      - KEYCLOAK_CLIENT_SECRET_KEY=AVGFxZoFoaD61OUwyiTCc3IAAS3PJNTC
      - KEYCLOAK_ISSUER_CLIENT_ID=vera
    depends_on:
      - postgres
      - worker
    networks:
      - digiboard

volumes:
  data:

networks:
  digiboard:

