services:
  postgres:
    image: postgres:17
    container_name: vera-postgres
    ports:
      - "5432:5432"
    env_file:
      - config/postgres.env
      - config/tz.env
    volumes:
      - data:/var/lib/postgresql/data
    networks:
      - vera

  index:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    container_name: vera-index
    ports:
      - "9200:9200"
    env_file:
      - config/index.env
      - config/tz.env
    volumes:
      - index:/usr/share/elasticsearch/data
    networks:
      - vera

  ai:
    container_name: vera-ai
    build:
      context: ./vera_ai
    ports:
      - "8001:8000"
    env_file:
      - config/ai.env
      - config/tz.env
    restart: unless-stopped
    networks:
      - vera

  worker:
    container_name: vera-worker
    build:
      context: ./server
      dockerfile: Dockerfile_celery
    env_file:
      - config/worker.env
      - config/keycloak.env
      - config/postgres.env
      - config/tz.env
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    networks:
      - vera

  redis:
    container_name: vera-redis
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      - vera

  server:
    container_name: vera-server
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - config/app.env
      - config/keycloak.env
      - config/postgres.env
      - config/tz.env
    depends_on:
      - ai
      - worker
      - postgres
      - index
    networks:
      - vera

  client:
    container_name: vera-client
    build:
      context: ./webclient
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - config/tz.env
    depends_on:
      - server
    networks:
      - vera

  docs-diagrams:
    image: structurizr/lite:latest
    container_name: vera-docs-diagrams
    ports:
      - "8080:8080"
    volumes:
      - ./docs:/usr/local/structurizr
    restart: unless-stopped

volumes:
  data:
  index:

networks:
  vera:

