version: '3.1'

services:
  postgres:
    image: postgres:latest
    container_name: vera-postgres
    environment:
      POSTGRES_USER: veraAdmin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: vera
    ports:
      - "5432:5432"
    volumes:
      - data:/var/lib/postgresql/data
    networks:
      - vera

  redis:
    container_name: vera-redis
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      - vera

  worker:
    container_name: vera-worker
    build:
      context: ./server
      dockerfile: Dockerfile_celery
    restart: unless-stopped
    environment:
      - BROKER_URL=redis://redis:6379/0
      - POSTGRES_HOST=postgres
      - TIMEZONE=Europe/Prague
    depends_on:
      - postgres
      - redis
    networks:
      - vera

  server:
    container_name: vera-server
    build:
      context: ./server
        #dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - BROKER_URL=redis://redis:6379/0
      - DEBUG=True
      - POSTGRES_HOST=postgres
      - ALLOW_ORIGINS=http://localhost:3000
      - TIMEZONE=Europe/Prague
      - KEYCLOAK_CLIENT_ID=vera-backend
      - KEYCLOAK_REALM=mzk
      - KEYCLOAK_SERVER_URL=https://keycloak.osdd.mzk.cz
      - KEYCLOAK_CLIENT_SECRET_KEY=AVGFxZoFoaD61OUwyiTCc3IAAS3PJNTC
      - KEYCLOAK_ISSUER_CLIENT_ID=vera
    depends_on:
      - worker
      - postgres
    networks:
      - vera

  client:
    container_name: vera-client
    build:
      context: ./webclient
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - server
    networks:
      - vera

volumes:
  data:

networks:
  vera:

