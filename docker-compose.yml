services:
  postgres-test:
    image: postgres:latest
    container_name: vera-postgres-test
    environment:
      POSTGRES_USER: veraAdmin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: vera-test
    ports:
      - "5433:5432"
    volumes:
      - data:/var/lib/postgresql/data-test
    networks:
      - vera

  postgres:
    image: postgres:latest
    container_name: vera-postgres
    environment:
      POSTGRES_USER: veraAdmin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: vera
    ports:
      - "5432:5432"
    volumes:
      - data:/var/lib/postgresql/data
    networks:
      - vera

  redis:
    container_name: vera-redis
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      - vera

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    container_name: vera-index
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=veraIndex
      - ES_JAVA_OPTS=-Xms128m -Xmx1g
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - index:/usr/share/elasticsearch/data
    networks:
      - vera

  ai:
    container_name: vera-ai
    build:
      context: ./vera_ai
    ports:
      - "8001:8000"
    restart: unless-stopped
    environment:
      - TIMEZONE=Europe/Prague
    networks:
      - vera

  worker:
    container_name: vera-worker
    build:
      context: ./server
      dockerfile: Dockerfile_celery
    restart: unless-stopped
    environment:
      - BROKER_URL=redis://redis:6379/0
      - POSTGRES_HOST=postgres
      - TIMEZONE=Europe/Prague
      - KRAMERIUS_API_URL=https://api.kramerius.mzk.cz/search
    depends_on:
      - postgres
      - redis
    networks:
      - vera

  server:
    container_name: vera-server
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - BROKER_URL=redis://redis:6379/0
      - DEBUG=True
      - POSTGRES_HOST=postgres
      - ALLOW_ORIGINS=http://localhost:3000
      - TIMEZONE=Europe/Prague
      - KEYCLOAK_CLIENT_ID=vera-backend
      - KEYCLOAK_REALM=mzk
      - KEYCLOAK_SERVER_URL=https://keycloak.osdd.mzk.cz
      - KEYCLOAK_CLIENT_SECRET_KEY=AVGFxZoFoaD61OUwyiTCc3IAAS3PJNTC
      - KEYCLOAK_ISSUER_CLIENT_ID=vera
      - KRAMERIUS_API_URL=https://api.kramerius.mzk.cz/search
    depends_on:
      - ai
      - worker
      - postgres
    networks:
      - vera

  client:
    container_name: vera-client
    build:
      context: ./webclient
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - server
    networks:
      - vera

volumes:
  data:
  index:

networks:
  vera:

