project:
  name: VERA
  logo: V
  tagline: Digitization Planning System
  version: 0.2.0

# Size tiers. Authoritative copy is view-rules.md §"Size tiers" — these must
# match it, and the demo directory is the artifact each one is checked against.
viewports:
  - { name: Phone,    width: 393,  icon: phone,   tier: phone,    demos: demos/phone }
  - { name: Small,    width: 1024, icon: tablet,  tier: small,    demos: demos/small }
  - { name: Notebook, width: 1440, icon: laptop,  tier: notebook, demos: demos/notebook, default: true }
  - { name: Large,    width: 1920, icon: desktop, tier: large,    demos: demos/large }

# What is decided. Nothing else in docs/ is binding — see docs/README.md.
shared:
  rules:
    - id: view-rules
      name: View Rules
      file: shared/view-rules.md
    - id: view-map
      name: View Map
      file: shared/view-map.md
    - id: document-use-cases
      name: Document Use Cases
      file: shared/document-use-cases.md
    - id: navigation
      name: Navigation
      file: shared/navigation.md
    - id: view-catalog
      name: View Catalog
      file: shared/view-catalog.md
    - id: page-composition
      name: Page Composition
      file: shared/page-composition.md
  entities:
    - id: concepts
      name: Concepts
      file: shared/entities/concepts.md
    - id: status-model
      name: Status Model
      file: shared/entities/status-model.md
    - id: relationships
      name: Entity Relationships
      file: shared/entities/relationships.md
    - id: permissions
      name: Permissions
      file: shared/entities/permissions.md
    - id: registry-status
      name: Registry Status
      file: shared/entities/registry-status.md
    - id: status-log
      name: Status Log
      file: shared/entities/status-log.md
    - id: intentions
      name: Intentions and Distributions
      file: shared/entities/intentions.md
    - id: document-identity
      name: Document Identity
      file: shared/entities/document-identity.md
    - id: document-properties
      name: Document Properties
      file: shared/entities/document-properties.md
    - id: identifier-types
      name: Identifier Types
      file: shared/entities/identifier-types.md
    - id: priority-levels
      name: Priority Levels
      file: shared/entities/priority-levels.md

